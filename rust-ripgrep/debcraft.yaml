name: rust-ripgrep
version: 15.1.0-1ubuntu1
summary: Recursively searches directories for a regex pattern.
description: |
  ripgrep is a line-oriented search tool that recursively searches the current
  directory for a regex pattern. By default, ripgrep will respect gitignore 
  rules and automatically skip hidden files/directories and binary files.
base: ubuntu@24.04
maintainer: Ubuntu Developers <ubuntu-devel-discuss@lists.ubuntu.com>
original-maintainer: Sylvestre Ledru <sylvestre@debian.org>
section: universe/utils

packages:
  ripgrep:
    section: utils

parts:
  ripgrep:
    plugin: rust
    source: https://git.launchpad.net/ubuntu/+source/rust-ripgrep
    source-type: git
    source-tag: applied/$CRAFT_PROJECT_VERSION
